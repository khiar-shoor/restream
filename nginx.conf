worker_processes auto;
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 8000;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # These will be dynamically injected by start.sh
            ${PUSH_TWITCH}
            ${PUSH_KICK}
        }
    }
}