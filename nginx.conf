worker_processes auto;
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

rtmp {
    server {
        # Runflare will map your domain to this port
        listen 8000; 
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Push to Twitch (Standard RTMP)
            push rtmp://ingest.global-contribute.live-video.net/app/${TWITCH_KEY};

            # Push to Kick via our local Stunnel (which secures it to RTMPS)
            push rtmp://127.0.0.1:1936/app/${KICK_KEY};
        }
    }
}
