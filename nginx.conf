worker_processes auto;
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        location /auth {
            # Injected dynamically by start.sh
            ${AUTH_CHECK}
        }
    }
}

rtmp {
    server {
        listen 8000;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Send authentication data via GET so $arg_name can read it
            notify_method get;

            # Authenticate stream before accepting
            on_publish http://127.0.0.1:8080/auth;

            # Dynamically injected by start.sh
            ${PUSH_TWITCH}
            ${PUSH_KICK}
        }
    }
}